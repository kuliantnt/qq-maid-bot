name: CI

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      # 纯文档变更不需要跑整套 Rust CI（参考 AGENTS.md 常用验证）
      # 注意：pull_request 不加 paths-ignore，否则纯文档 PR 缺少 CI 状态，无法合并
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "LICENSE"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      windows: ${{ steps.filter.outputs.windows }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected checks
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          trap 'rm -f "${changed_files}"' EXIT

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            printf '%s\n' '.github/workflows/ci.yml' > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > "${changed_files}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}...HEAD" > "${changed_files}"
          else
            git ls-files > "${changed_files}"
          fi

          shell=false
          windows=false
          frontend=false
          rust=false
          if grep -Eq '(^|/)scripts/.*\.sh$|^\.github/workflows/ci\.yml$' "${changed_files}"; then
            shell=true
          fi
          if grep -Eq '(^|/)scripts/.*\.(ps1|cmd)$|^scripts/(botctl|test-windows-botctl)\.sh$|^scripts/tests/windows-smoke\.cs$|^\.github/workflows/ci\.yml$' "${changed_files}"; then
            windows=true
          fi
          if grep -Eq '^web-console/(src|tests|scripts)/|^web-console/(package\.json|package-lock\.json|tsconfig\.json)$|^web-console/dist/|^assets/(favicon\.png|special-sprite\.webp)$|^\.github/workflows/ci\.yml$' "${changed_files}"; then
            frontend=true
          fi
          if grep -Eq '\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain|^runtime/|^Makefile|^\.github/workflows/ci\.yml$' "${changed_files}"; then
            rust=true
          fi
          echo "shell=${shell}" >> "${GITHUB_OUTPUT}"
          echo "windows=${windows}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"

  shell:
    name: Shell checks
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run installer regression tests
        run: |
          bash scripts/test-qbot-install.sh
          bash scripts/test-qbot-config.sh
          bash scripts/test-package-release.sh
          bash scripts/test-prepare-project-docs-kb.sh
          bash scripts/test-botctl-guidance.sh
          bash scripts/tests/test-docker-deploy.sh
          bash scripts/tests/test-container-release-gate.sh

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 bash -n

  windows-botctl:
    name: Windows botctl smoke test
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($_.Name): $($errors -join '; ')"
            }
          }

      - name: Build native Windows smoke executable
        shell: powershell
        run: |
          Add-Type -TypeDefinition (Get-Content scripts/tests/windows-smoke.cs -Raw) -OutputType ConsoleApplication -OutputAssembly "$env:RUNNER_TEMP\qq-maid-bot.exe"

      - name: Exercise start, status, stop, and forced stop
        shell: bash
        run: bash scripts/test-windows-botctl.sh "$RUNNER_TEMP/qq-maid-bot.exe"

      - name: Exercise native PowerShell controller
        shell: powershell
        run: .\scripts\test-windows-powershell-botctl.ps1 "$env:RUNNER_TEMP\qq-maid-bot.exe"

      - name: Exercise native PowerShell installer
        shell: powershell
        run: .\scripts\test-windows-qbot.ps1

  frontend:
    name: Web Console checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - name: Install dependencies
        working-directory: web-console
        run: npm ci

      - name: Type-check frontend
        working-directory: web-console
        run: npm run check

      - name: Build frontend
        working-directory: web-console
        run: npm run build

      - name: Run frontend tests
        working-directory: web-console
        run: npm test

      - name: Verify committed dist is reproducible
        run: git diff --exit-code -- web-console/dist

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # PR 时需要历史记录做 diff

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binaries
        run: cargo build --workspace --release --all-features
